<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Hospital</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .bg-sky-blue {
            background-color: #0284c7;
        }

        /* ================= HERO ================= */
        .hero {
            min-height: calc(100vh - 56px);
            background-color: #483d8b; /* darkslateblue */
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 40px 0;
        }

        .hero-left {
            z-index: 2;
            padding-left: 80px;
        }

        .hero-left h1 {
            font-size: 58px;
            line-height: 1.15;
            max-width: 650px;
        }

        .hero-left p {
            font-size: 18px;
            line-height: 1.6;
            max-width: 550px;
            color: #e2ecff;
        }

        .hero-right {
            padding-right: 80px;
        }

        /* ================= RESPONSIVE ADJUSTMENTS ================= */
        @media (max-width: 992px) {
            .hero-left {
                padding-left: 30px;
                padding-right: 30px;
                text-align: center;
                margin-bottom: 30px;
            }
            .hero-left h1 {
                font-size: 42px;
                margin: 0 auto 1.5rem auto;
            }
            .hero-left p {
                margin: 0 auto;
            }
            .hero-right {
                padding-right: 0;
            }
        }

        @media (max-width: 768px) {
            .hero {
                min-height: calc(100vh - 100px);
                padding: 40px 20px;
            }
            .hero-left h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg bg-white navbar-dark shadow-sm">
        <div class="container">
            <div class="navbar-nav mx-auto gap-3">
                <a class="nav-link text-black fw-bold active" href="/app/app_home/">Home</a>
                <a class="nav-link text-black" href="/app/doctor/show/">Doctors</a>
                <a class="nav-link text-black" href="/app/appointment/show/">Appointment</a>
                <a class="nav-link text-black" href="/app/patient/show/">Patient</a>
                <a class="nav-link text-black" href="{% url 'logout' %}">Logout</a>
            </div>
        </div>
    </nav>

    <!-- ================= HERO SECTION ================= -->
    <section class="hero position-relative">
        <div class="container-fluid p-0">
            <div class="row g-0 align-items-center">

                <!-- LEFT CONTENT -->
                <div class="col-12 col-lg-7 hero-left text-white my-auto">
                    <h1 class="fw-bold mb-4">
                        WELLNESS Hospital Details...
                    </h1>

                    <p class="mb-0">
                        A Healthier Tomorrow Starts Today!!!!
                        <br>
                        Your Wellness, Our Expertise!!!
                    </p>
                </div>




            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
