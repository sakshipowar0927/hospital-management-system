<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>show</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-light-blue { background-color: #e3f2fd; }
        .bg-sky-blue { background-color: #0284c7; }
        .btn-sky-blue { background-color: #0284c7; color: #fff; }
        .btn-sky-blue:hover { background-color: #0369a1; color: #fff; }
        .btn-outline-sky { color: #0284c7; border-color: #0284c7; }
        .btn-outline-sky:hover { background-color: #0284c7; color: #fff; }
    </style>
</head>
<body class="bg-light-blue">



<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-sky-blue navbar-dark shadow-sm">
    <div class="container">
        <div class="navbar-nav mx-auto gap-3">
            <a class="nav-link text-white" href="/app/app_home/">Home</a>
            <a class="nav-link text-white" href="/app/doctor/show/">Doctors</a>
            <a class="nav-link text-white" href="/app/appointment/show/">Appointment</a>
            <a class="nav-link text-white fw-bold active" href="/app/patient/show/">Patient</a>
            <a class="nav-link text-white" href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0 fw-bold text-dark">Patient Information</h2>
        <a href="/app/patient/insert/" class="btn btn-sky-blue">Add Patient Info</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="bg-sky-blue text-white">
                        <tr>
                            <th>Id</th>
                            <th>Patient Name</th>
                            <th>Contact</th>
                            <th>Age</th>
                            <th>Medical History</th>
                            <th class="text-center">Edit</th>
                            <th class="text-center">Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for patient in patients %}
                        <tr>
                            <td>{{ patient.pid }}</td>
                            <td>{{ patient.pnm }}</td>
                            <td>{{ patient.con }}</td>
                            <td>{{ patient.a }}</td>
                            <td>{{ patient.m }}</td>
                            <td class="text-center">
                                <a href="/app/patient/update/{{ patient.pid }}/" class="btn btn-sm btn-outline-sky">Edit</a>
                            </td>
                            <td class="text-center">
                                <a href="/app/patient/delete/{{ patient.pid }}/" class="btn btn-sm btn-outline-danger">delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
